# BlindVault 2-of-3 Multi-Bucket MinIO Erasure-Coding Stack
# Launches 3 independent S3-compatible object stores and bootstraps shard buckets.
#
# Usage:
#   docker compose -f docker-compose.vault.yml up -d
#   export BLINDVAULT_SHARD0_URL=http://127.0.0.1:9000/blindvault-shard0
#   export BLINDVAULT_SHARD1_URL=http://127.0.0.1:9002/blindvault-shard1
#   export BLINDVAULT_SHARD2_URL=http://127.0.0.1:9004/blindvault-shard2
#   export AWS_ACCESS_KEY_ID=minioadmin
#   export AWS_SECRET_ACCESS_KEY=minioadmin

services:
  minio0:
    image: minio/minio:latest
    container_name: blindvault-minio0
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio0_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio1:
    image: minio/minio:latest
    container_name: blindvault-minio1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio1_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio2:
    image: minio/minio:latest
    container_name: blindvault-minio2
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9004:9000"
      - "9005:9001"
    volumes:
      - minio2_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: blindvault-minio-init
    depends_on:
      minio0:
        condition: service_healthy
      minio1:
        condition: service_healthy
      minio2:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set s0 http://minio0:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc alias set s1 http://minio1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc alias set s2 http://minio2:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing s0/blindvault-shard0
        mc mb --ignore-existing s1/blindvault-shard1
        mc mb --ignore-existing s2/blindvault-shard2
        echo "BlindVault S3 erasure shard buckets initialized."

volumes:
  minio0_data:
  minio1_data:
  minio2_data:

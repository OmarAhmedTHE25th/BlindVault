name: Build and Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: Build Linux AppImage
  # ==========================================
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libssl-dev \
            libboost-dev \
            libboost-system-dev \
            qt6-base-dev \
            libgl1-mesa-dev \
            wget \
            file

      - name: Prepare Desktop Entry & Icon
        run: |
          cat << 'EOF' > blindvault.desktop
          [Desktop Entry]
          Type=Application
          Name=BlindVault
          Exec=BlindVault_GUI
          Icon=blindvault_icon
          Categories=Utility;Network;
          Terminal=false
          EOF

      - name: Build Project (Release)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DP2P_BUILD_GUI=ON \
            -DP2P_BUILD_TESTS=OFF
          cmake --build build --target BlindVault_GUI

      - name: Download AppImage Packaging Tools
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Generate AppImage
        run: |
          export QMAKE=/usr/lib/qt6/bin/qmake
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            -e build/BlindVault_GUI \
            -d blindvault.desktop \
            -i assets/blindvault_icon.png \
            --plugin qt \
            --output appimage

          mv BlindVault-x86_64.AppImage BlindVault-Linux-x86_64.AppImage

      - name: Upload Linux Asset
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: BlindVault-Linux-x86_64.AppImage

  # ==========================================
  # JOB 2: Build Native Windows Executable
  # ==========================================
  build-windows:
    name: Build Windows x64 Bundle
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@v1.1

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Setup vcpkg caching
        uses: actions/cache@v4
        with:
          path: |
            C:/Users/runneradmin/AppData/Local/vcpkg/archives
            ${{ github.workspace }}/build/vcpkg_installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Install OpenSSL and Boost
        run: |
          vcpkg install openssl:x64-windows boost-system:x64-windows boost-asio:x64-windows boost-endian:x64-windows boost-beast:x64-windows boost-json:x64-windows

      - name: Configure CMake
        run: |
          $ref = "$env:GITHUB_REF_NAME"
          if ($ref -match '^v?(\d+)\.(\d+)\.(\d+)') {
            $msiVersion = "$($matches[1]).$($matches[2]).$($matches[3])"
          } elseif ($ref -match '^v?(\d+)\.(\d+)$') {
            $msiVersion = "$($matches[1]).$($matches[2]).0"
          } else {
            $msiVersion = "2.2.1"
          }
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DP2P_BUILD_GUI=ON `
            -DP2P_BUILD_TESTS=OFF `
            -DCPACK_PACKAGE_VERSION="$msiVersion" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build Binaries (CLI & GUI)
        run: cmake --build build --target BlindVault BlindVault_GUI --config Release

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install WiX Toolset v5
        run: |
          dotnet tool install --global wix --version 5.0.2
          $env:Path = "$env:USERPROFILE\.dotnet\tools;$env:Path"
          wix extension add --global WixToolset.UI.wixext/5.0.2

      - name: Build Self-Contained Windows MSI with CPack
        working-directory: build
        run: |
          $env:Path = "$env:USERPROFILE\.dotnet\tools;$env:Path"
          cpack -G WIX -C Release --verbose
          Copy-Item .\BlindVault-Windows-x64.msi ..\BlindVault-Windows-x64.msi -Force

      - name: Verify MSI Contents
        run: |
          $msiPath = (Resolve-Path ".\BlindVault-Windows-x64.msi").Path
          $extractDir = Join-Path $env:RUNNER_TEMP "msi_verify"
          if (Test-Path $extractDir) { Remove-Item -Recurse -Force $extractDir }
          New-Item -ItemType Directory -Path $extractDir | Out-Null

          $proc = Start-Process -FilePath "msiexec.exe" `
            -ArgumentList "/a `"$msiPath`" /qn TARGETDIR=`"$extractDir`"" `
            -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "msiexec administrative extraction failed with exit code $($proc.ExitCode)"
          }

          $extractedFiles = Get-ChildItem -Path $extractDir -Recurse -File
          foreach ($req in @("BlindVault.exe", "BlindVault_GUI.exe", "Qt6Core.dll", "libcrypto-3-x64.dll", "libssl-3-x64.dll")) {
            if (-not ($extractedFiles | Where-Object { $_.Name -ieq $req })) {
              throw "Missing required file inside MSI: $req"
            }
          }
          if (-not ($extractedFiles | Where-Object { ($_.FullName -replace '/', '\') -ilike '*\platforms\qwindows.dll' })) {
            throw "Missing required Qt platform plugin inside MSI: platforms\qwindows.dll"
          }
          $msiSizeMb = [math]::Round((Get-Item $msiPath).Length / 1MB, 2)
          Write-Host "Verified BlindVault-Windows-x64.msi ($msiSizeMb MB) with $($extractedFiles.Count) extracted files."

      - name: Package Portable Windows ZIP
        run: |
          cmake --install build --prefix dist --config Release
          Compress-Archive -Path dist\bin\* -DestinationPath BlindVault-Windows-x64.zip -Force

      - name: Upload Windows Assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            BlindVault-Windows-x64.msi
            BlindVault-Windows-x64.zip

  # ==========================================
  # JOB 3: Publish GitHub Release
  # ==========================================
  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-assets

      - name: Publish Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "BlindVault ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            BlindVault-Linux-x86_64.AppImage
            BlindVault-Windows-x64.msi
            BlindVault-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
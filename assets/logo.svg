<svg xmlns="http://www.w3.org/2000/svg" width="376" height="88" viewBox="0 0 376 88" fill="none">
  <!-- High-contrast light pill container for GitHub Light and Dark themes -->
  <rect x="4" y="4" width="368" height="80" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- BlindVault geometric hexagonal aperture mark (60x60) -->
  <g transform="translate(18, 14) scale(0.9375)">
    <polygon points="7.75,18 32,4 56.25,18 32,32" fill="#1E293B" />
    <polygon points="7.75,18 32,32 32,60 7.75,46" fill="#0F172A" />
    <polygon points="32,32 56.25,18 56.25,46 32,60" fill="#142136" />

    <polygon
      points="32,4 56.25,18 56.25,46 32,60 7.75,46 7.75,18"
      fill="none"
      stroke="#0F172A"
      stroke-width="2"
      stroke-linejoin="round"
    />

    <g stroke="#10B981" stroke-opacity="0.72" stroke-width="1.5" stroke-linecap="round">
      <line x1="18.58" y1="24.25" x2="7.75" y2="18" />
      <line x1="45.42" y1="24.25" x2="56.25" y2="18" />
      <line x1="32" y1="47.5" x2="32" y2="60" />
    </g>

    <polygon
      points="32,16.5 45.42,24.25 45.42,39.75 32,47.5 18.58,39.75 18.58,24.25"
      fill="#0F172A"
      stroke="#10B981"
      stroke-width="2.2"
      stroke-linejoin="round"
    />

    <circle cx="32" cy="29.5" r="4.5" fill="#FFFFFF" />
    <path
      d="M29.8 33 L34.2 33 L35.4 40.8 Q35.5 41.6 34.7 41.6 L29.3 41.6 Q28.5 41.6 28.6 40.8 Z"
      fill="#FFFFFF"
    />

    <line x1="22.5" y1="41.5" x2="41.5" y2="22.5" stroke="#0F172A" stroke-width="5.6" stroke-linecap="round" />
    <line x1="22.5" y1="41.5" x2="41.5" y2="22.5" stroke="#10B981" stroke-width="2.8" stroke-linecap="round" />
  </g>

  <!-- Clean geometric wordmark -->
  <text
    x="92"
    y="47"
    fill="#0F172A"
    font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="33"
    font-weight="800"
    letter-spacing="-0.8"
  >BlindVault</text>
  <text
    x="93"
    y="65"
    fill="#059669"
    font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="10.5"
    font-weight="700"
    letter-spacing="1.4"
  >ZERO-KNOWLEDGE STORAGE GATEWAY</text>
</svg>
